{% extends 'base.html' %}
{% block title %}Meu Perfil{% endblock %}
{% block page_title %}Meu Perfil{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="dark:bg-gray-800 bg-white rounded-xl border dark:border-gray-700 border-gray-200 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b dark:border-gray-700 border-gray-200">
      <h2 class="font-display font-semibold dark:text-white text-gray-900">Meu Perfil</h2>
    </div>
    <form method="post" enctype="multipart/form-data" class="p-6 space-y-4">
      {% csrf_token %}
      <div class="grid grid-cols-2 gap-4">
        {% for field in form %}
        <div>
          <label class="block text-sm font-medium dark:text-gray-300 text-gray-700 mb-1.5">{{ field.label }}</label>
          {{ field }}
        </div>
        {% endfor %}
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium font-display transition-colors">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
