{% extends 'base.html' %}
{% block title %}Excluir Produto{% endblock %}
{% block page_title %}Excluir Produto{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="dark:bg-gray-800 bg-white rounded-xl border dark:border-gray-700 border-gray-200 shadow-sm p-8 text-center">
    <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </div>
    <h2 class="font-display font-bold text-xl dark:text-white text-gray-900 mb-2">Excluir Produto</h2>
    <p class="dark:text-gray-400 text-gray-500 mb-6">Tem certeza que deseja excluir <strong class="dark:text-white text-gray-900">{{ produto.nome }}</strong>?</p>
    <form method="post" class="flex gap-3 justify-center">
      {% csrf_token %}
      <a href="{% url 'produtos:lista' %}" class="px-5 py-2.5 dark:bg-gray-700 bg-gray-100 dark:text-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:opacity-80">Cancelar</a>
      <button type="submit" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-medium">Excluir</button>
    </form>
  </div>
</div>
{% endblock %}
