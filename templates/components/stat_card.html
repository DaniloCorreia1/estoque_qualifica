{% load ui %}{# Card de indicador. Parametros: label, value, hint, icon, emphasis (bool: destaque invertido). #}
<div class="card card-link p-4 sm:p-5 {% if emphasis %}!border-inv{% endif %}">
  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-medium uppercase tracking-wide text-subtle">{{ label }}</span>
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl {% if emphasis %}bg-inv text-invfg{% else %}border border-line bg-surface2 text-muted{% endif %}">{% icon icon 'h-[18px] w-[18px]' %}</span>
  </div>
  <p class="mt-3 truncate text-xl font-bold tabular-nums tracking-tight sm:text-2xl xl:text-3xl">{{ value }}</p>
  {% if hint %}<p class="mt-1 text-xs text-subtle">{{ hint }}</p>{% endif %}
</div>
